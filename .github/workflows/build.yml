name: Compilar PSX-K2 (.nro Switch 2)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          apt-get update && apt-get install -y --no-install-recommends git curl zip ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Dependencias (ounce-devkit, Beetle PSX HW, ImGui)
        run: |
          export DEVKITPRO=/opt/devkitpro
          bash ./setup.sh

      - name: Compilar
        run: |
          export DEVKITPRO=/opt/devkitpro
          source $DEVKITPRO/switch2vars.sh
          make -j"$(nproc)" dist

      - name: Empaquetar
        run: cd dist && zip -r ../psx-k2-switch2.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: psx-k2-switch2
          path: |
            psx-k2-switch2.zip
            psx-k2.nro
            third_party/beetle-psx/*.log

      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            psx-k2-switch2.zip
            psx-k2.nro
