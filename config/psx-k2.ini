# PSX-K2 configuración global

[Video]
renderer = "hardware_vk"
internal_res = "4x"
output_res = "auto"
aspect = "4:3"
upscale_shader = "sharp"
msaa = "1x"
depth = "32bpp"
dither = "disabled"
widescreen = "disabled"
widescreen_ar = "16:9"
crop_overscan = "static"
vsync = "enabled"
show_fps = "disabled"

[Mejoras 3D (PGXP)]
pgxp_mode = "memory only"
pgxp_texture = "enabled"
pgxp_vertex = "disabled"
pgxp_nclip = "enabled"
pgxp_2d_tol = "disabled"
line_render = "default"

[Texturas y filtros]
tex_filter = "nearest"
filter_ex_sprite = "all"
filter_ex_2d = "all"
adaptive_smooth = "enabled"
supersampling = "disabled"
mdec_yuv = "disabled"
scaled_uv = "enabled"

[CPU y rendimiento]
cpu_freq = "100%(native)"
gte_oc = "disabled"
gpu_oc = "1x(native)"
audio_sync = "enabled"

[CD y BIOS]
skip_bios = "disabled"
cd_access = "sync"
cd_fastload = "2x(native)"

[Memory Cards]
memcard0_method = "libretro"
memcard1 = "enabled"
shared_mc = "disabled"
autosave = "5"

[Controles]
pad1 = "dualshock"
pad2 = "dualshock"
analog_toggle = "disabled"
rumble = "enabled"
face_layout = "position"

[Sistema]
cpu_boost = "disabled"
state_slot = "0"
