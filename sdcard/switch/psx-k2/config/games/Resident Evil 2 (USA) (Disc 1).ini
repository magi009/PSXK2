# Ejemplo de ajustes por juego: Resident Evil 2
# El nombre del archivo debe coincidir con el nombre del .cue/.chd/.m3u (sin extensión)

[Video]
internal_res = "4x"
depth = "32bpp"
dither = "disabled"

[Mejoras 3D (PGXP)]
# Modelos sólidos (cara de Leon/Claire sin deformarse) y texturas sin warping
pgxp_mode = "memory + CPU"
pgxp_texture = "enabled"
pgxp_nclip = "enabled"

[Texturas y filtros]
# Filtra los personajes 3D pero deja nítidos los fondos pre-renderizados
tex_filter = "xBR"
filter_ex_2d = "all"
filter_ex_sprite = "all"

[CD y BIOS]
cd_access = "precache"
